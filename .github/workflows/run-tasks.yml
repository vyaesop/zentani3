# Drains the background task queue (AI enrichment, fan-out sends like
# broadcasts and wishlist alerts, retries of failed inline sends, periodic
# sweeps) by hitting /internal/run-tasks/ on the deployed site. Quick Telegram
# sends (product posts, order/signup notifications) execute inline in the web
# request that creates them (see INLINE_TASK_TYPES in store/tasks.py), so
# nothing drained here is latency-sensitive: this is a cleanup sweep, not the
# delivery path. The daily Vercel cron in vercel.json remains as a fallback.
#
# Cost constraint: every drain call queries the Neon database, whose free-plan
# compute only autosuspends after 5 idle minutes. The previous version of this
# workflow polled every 60 seconds around the clock, which kept the database
# awake 24/7 and burned the entire 100 CU-hour monthly allowance by mid-month
# (Aug 2026). Hence the shape below: run sparsely, drain until the queue is
# empty, then exit immediately — never idle-poll.
#
# Requires the RUN_TASKS_SECRET repository secret to match the RUN_TASKS_SECRET
# (or CRON_SECRET) environment variable configured on Vercel. A mismatch shows
# up as an HTTP 403 from the endpoint and fails this job immediately.
name: Drain background tasks

on:
  schedule:
    # Nominally every 30 minutes; GitHub throttles scheduled workflows, so in
    # practice expect roughly one run per hour. That latency is fine for
    # everything left in the queue. Do NOT tighten this below ~15 minutes:
    # each run wakes the database for its 5-minute autosuspend window, so a
    # too-frequent schedule quietly recreates the 24/7-awake problem.
    - cron: "*/30 * * * *"
  workflow_dispatch:

concurrency:
  group: run-tasks-drain
  # A newer run supersedes an older one still draining. Safe to cut one off
  # mid-flight: the endpoint claims tasks atomically and anything left
  # stranded in RUNNING is requeued by _requeue_stale_running after 15 minutes.
  cancel-in-progress: true

jobs:
  drain:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Drain the queue until empty
        env:
          RUN_TASKS_SECRET: ${{ secrets.RUN_TASKS_SECRET }}
          # 50 is the endpoint's own per-call ceiling; BATCH_LIMIT must match
          # the limit in DRAIN_URL — a full batch means more work may remain.
          BATCH_LIMIT: "50"
          DRAIN_URL: https://zentanee.vercel.app/internal/run-tasks/?limit=50
        # Redirects are not followed on purpose: a redirect means the domain
        # moved and the drain silently stopped, so fail loudly instead.
        run: |
          set -uo pipefail

          if [ -z "$RUN_TASKS_SECRET" ]; then
            echo "::error::RUN_TASKS_SECRET repository secret is empty or unset."
            exit 1
          fi

          deadline=$(( $(date +%s) + 12 * 60 ))
          drained=0
          transient_streak=0

          while :; do
            # curl leaves the previous iteration's body in place when it fails
            # before writing, so clear it or the warning quotes a stale response.
            : > response.txt

            # Body and status are captured separately so the response is always
            # available. Interpolating curl into a `resp=$(...)` assignment loses
            # it: under `set -e` a non-2xx exit aborts before the echo can run,
            # which is what made earlier 403s show up as a bare "curl: (22)".
            status=$(curl --silent --show-error --max-time 120 \
              -H "Authorization: Bearer $RUN_TASKS_SECRET" \
              -o response.txt -w '%{http_code}' \
              "$DRAIN_URL") || status="000"

            case "$status" in
              200)
                if grep -q '"ok": true' response.txt; then
                  transient_streak=0
                  n=$(sed -n 's/.*"processed": *\([0-9]*\).*/\1/p' response.txt)
                  n=${n:-0}
                  drained=$((drained + n))
                  if [ "$n" -gt 0 ]; then
                    echo "$(date -u +%H:%M:%S)Z drained $n task(s)"
                  fi
                  # A partial batch means nothing due is left: stop right away
                  # so the database can suspend. Only a full batch warrants
                  # another call.
                  if [ "$n" -lt "$BATCH_LIMIT" ]; then
                    break
                  fi
                else
                  transient_streak=$((transient_streak + 1))
                  echo "::warning::HTTP 200 but payload was not ok: $(head -c 300 response.txt)"
                fi
                ;;
              403)
                echo "::error::HTTP 403 — the RUN_TASKS_SECRET repository secret does not match RUN_TASKS_SECRET/CRON_SECRET on Vercel, or Vercel has neither set."
                head -c 300 response.txt
                exit 1
                ;;
              3??)
                echo "::error::HTTP $status redirect — the deployment domain moved. Update DRAIN_URL in this workflow."
                exit 1
                ;;
              *)
                # Cold starts, 5xx and network blips deserve a few retries, but
                # a persistent failure should fail the run loudly.
                transient_streak=$((transient_streak + 1))
                echo "::warning::HTTP $status from the drain endpoint: $(head -c 300 response.txt)"
                ;;
            esac

            if [ "$transient_streak" -ge 5 ]; then
              echo "::error::5 consecutive drain calls failed; giving up."
              exit 1
            fi
            if [ "$(date +%s)" -ge "$deadline" ]; then
              echo "::warning::Deadline reached with a full batch still coming in; the next scheduled run continues."
              break
            fi
            # Only transient failures pause; full batches re-poll immediately.
            if [ "$transient_streak" -gt 0 ]; then
              sleep 20
            fi
          done

          echo "$drained task(s) drained."
