<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Zentanee | Something went wrong</title>
  <meta name="robots" content="noindex">
  <meta name="theme-color" content="#111111">
  <style>
    /* Standalone: no database, no static files. Same cloth as the store: cotton-white ground,
       ink type and rules, square corners, the indigo selvedge under the one primary action. */
    *, *::before, *::after { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; background: #fbfbf8; color: #111111; font-family: Archivo, "Helvetica Neue", Arial, sans-serif; font-size: 16px; line-height: 1.55; -webkit-font-smoothing: antialiased; }
    ::selection { background: #1f3a93; color: #ffffff; }
    :focus-visible { outline: 3px solid #1f3a93; outline-offset: 3px; }
    .band { height: 10px; border-top: 2px solid #111111; border-bottom: 2px solid #111111; }
    main { max-width: 560px; margin: 0 auto; padding: 40px 16px 64px; }
    h1 { margin: 0 0 14px; font-family: Unbounded, Archivo, "Helvetica Neue", Arial, sans-serif; font-weight: 700; font-size: clamp(28px, 6vw, 44px); line-height: 1.02; letter-spacing: -0.02em; text-wrap: balance; }
    p { margin: 0; color: #3d3a36; max-width: 46ch; }
    .rule { height: 0; border-top: 2px solid #111111; margin: 24px 0; }
    .actions { display: flex; flex-wrap: wrap; gap: 10px; }
    .zh-btn { display: inline-flex; align-items: center; justify-content: center; min-height: 50px; padding: 0 18px; border: 2px solid #111111; background: #111111; color: #ffffff; font-family: Unbounded, Archivo, "Helvetica Neue", Arial, sans-serif; font-weight: 600; font-size: 12.5px; letter-spacing: 0.02em; text-decoration: none; }
    .zh-btn--primary { border-bottom: 6px solid #1f3a93; }
    .zh-btn--ghost { background: transparent; color: #111111; }
    .zh-btn:hover, .zh-btn:focus-visible { background: #ffffff; color: #111111; }
    .zh-btn--ghost:hover, .zh-btn--ghost:focus-visible { background: #111111; color: #ffffff; }
    @media (min-width: 768px) { main { padding: 56px 24px 80px; } }
  </style>
</head>
<body>
  <div class="band" aria-hidden="true"></div>
  <main>
    <h1>Something went wrong on our side.</h1>
    <p>Your cart and any order you already placed are safe. Please try again in a moment, or call us and we will finish the order by phone.</p>
    <div class="rule" aria-hidden="true"></div>
    <div class="actions">
      <a class="zh-btn zh-btn--primary" href="/">Back to the store</a>
      <a class="zh-btn zh-btn--ghost" href="/cart/">Open my cart</a>
    </div>
  </main>
</body>
</html>
