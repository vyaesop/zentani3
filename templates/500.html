<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Zentanee | Something went wrong</title>
  <meta name="robots" content="noindex">
  <style>
    body { margin: 0; font-family: Archivo, "Segoe UI", system-ui, sans-serif; background: #f9f8f6; color: #0d0d0d; }
    main { max-width: 560px; margin: 12vh auto; padding: 0 24px; text-align: center; }
    p.eyebrow { font-size: 11px; letter-spacing: .14em; text-transform: uppercase; color: #666; }
    h1 { font-size: 28px; margin: 8px 0 12px; }
    p { line-height: 1.6; color: #444; }
    a.btn { display: inline-block; margin: 6px; padding: 12px 20px; border-radius: 999px; background: #0d0d0d; color: #fff; text-decoration: none; font-weight: 600; }
    a.btn.ghost { background: transparent; color: #0d0d0d; border: 1px solid #0d0d0d; }
  </style>
</head>
<body>
  <main>
    <p class="eyebrow">500</p>
    <h1>Something went wrong on our side.</h1>
    <p>Your cart and any order you already placed are safe. Please try again in a moment, or call us and we will finish the order by phone.</p>
    <a class="btn" href="/">Back to the store</a>
    <a class="btn ghost" href="/cart/">Open my cart</a>
  </main>
</body>
</html>
