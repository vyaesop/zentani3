{% extends 'base.html' %}
{% load i18n %}

{% block title %}{{ store.name }} | {% trans "Password updated" %}{% endblock %}

{% block content %}
<main class="zh-main">
  <div class="zh-wrap">
      <div class="zh-page__head">
          <h1>{% trans "Password updated" %}</h1>
          <p class="zh-lede">{% trans "You can log in with your phone number and the new password." %}</p>
      </div>

      <div class="zh-auth">
          <div class="zh-actions">
              <a href="{% url 'store:login' %}" class="zh-btn zh-btn--primary">{% trans "Log in" %}</a>
          </div>
      </div>
  </div>
</main>
{% endblock content %}
