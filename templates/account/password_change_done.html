{% extends 'base.html' %}
{% load i18n %}

{% block title %}{{ store.name }} | {% trans "Password changed" %}{% endblock %}

{% block content %}
<main class="zh-main">
  <div class="zh-wrap">
      <div class="zh-page__head">
          <h1>{% trans "Password changed" %}</h1>
          <p class="zh-lede">{% trans "Your password was updated successfully." %}</p>
      </div>

      <div class="zh-auth">
          <div class="zh-actions">
              <a href="{% url 'store:profile' %}" class="zh-btn zh-btn--primary">{% trans "Back to my account" %}</a>
          </div>
      </div>
  </div>
</main>
{% endblock content %}
