{# Out-of-band swaps: refresh the header and tab-bar cart badges after any cart mutation. #}
<span class="zh-cart__count zh-num" id="cart-count-desktop" hx-swap-oob="true">{{ cart_items_count }}</span>
<span class="zh-tabbar__badge zh-num {% if not cart_items_count %}is-zero{% endif %}" id="cart-count-bottomnav" hx-swap-oob="true">{{ cart_items_count }}</span>
