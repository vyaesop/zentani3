{% if messages %}
<div class="zent-messages" role="status" aria-live="polite">
    {% for message in messages %}
    <div class="zent-alert zent-alert--{% if message.tags == 'error' %}danger{% else %}{{ message.tags|default:'info' }}{% endif %}">
        {{ message }}
    </div>
    {% endfor %}
</div>
{% endif %}
